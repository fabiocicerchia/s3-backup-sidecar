site_name: s3-backup-sidecar
site_description: >-
  A restic backup sidecar with cron built in and env-only config, tested
  with a real backup-and-restore round trip.
repo_url: https://github.com/fabiocicerchia/s3-backup-sidecar
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
