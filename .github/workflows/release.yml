name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR tags the
# release (vX.Y.Z) and publishes a GitHub Release. Nothing else to run.

on:
  push:
    branches: [main]

# Two pushes landing seconds apart start two release-pr jobs, and both update
# refs/heads/release-please--branches--main — the loser dies on "Error updating
# ref". Queue them rather than cancelling: a release interrupted half-way is
# worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    permissions:
      contents: write # create tags & releases
      pull-requests: write # open/update the release PR
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        id: rp
        with:
          # A release PR opened with GITHUB_TOKEN is authored by
          # `github-actions[bot]`, which is not a repo collaborator: every
          # `pull_request` workflow on that branch lands in `action_required`
          # and waits for a human click, so the release PR never shows a CI
          # result until someone approves 7 runs by hand. A PAT with
          # contents+pull-requests write makes the PR author an identity with
          # write access, and the checks just run. Falls back to GITHUB_TOKEN
          # so a repo without the secret keeps today's behaviour.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # "simple" is language-agnostic (tracks version.txt + CHANGELOG).
          # Swap for node/python/rust/etc. to also bump manifests.
          release-type: simple

  # Building the image has to hang off this job rather than off the release
  # event: the release release-please publishes carries GITHUB_TOKEN, and
  # GitHub does not start workflows from GITHUB_TOKEN events. Called in the
  # same run, it just works — no PAT to mint, rotate, or leak.
  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      # A called workflow's token is capped by what the caller grants, and a
      # scope missing from this block is `none` however the called workflow
      # declares it. Without this, publish.yml pushes the image and only then
      # fails at `cosign sign` with no OIDC token — an unsigned image and a red
      # release, on the path that actually runs. The `release` and
      # `workflow_dispatch` triggers hit that file directly and were fine,
      # which is what made this look tested.
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    # A called workflow sees no secrets unless they are handed over. Named
    # rather than `secrets: inherit`, so it gets the Docker Hub pair and
    # nothing else this repository happens to hold.
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
